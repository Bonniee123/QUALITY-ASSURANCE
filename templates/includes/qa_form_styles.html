{% comment %}Shared polish for QA Structure / Mapping CRUD forms. Include inside {% block content %}.{% endcomment %}
<style>
.qa-form-shell { max-width: 720px; margin: 0 auto; }
.qa-form-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    padding: 28px 32px;
}
.qa-form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px 20px;
}
.qa-form-grid .qa-field-full { grid-column: 1 / -1; }
.qa-form-section {
    font-size: var(--text-xs);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--color-text-muted);
    margin: 8px 0 12px;
    padding-bottom: 8px;
    border-bottom: 1px dashed var(--color-border);
}
.qa-form-actions {
    position: sticky;
    bottom: 0;
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 16px 0 4px;
    margin-top: 8px;
    background: var(--color-surface);
}
.qa-form-card .form-control.is-invalid,
.qa-form-card .form-select.is-invalid { border-color: hsl(0, 65%, 55%); }
@media (max-width: 640px) { .qa-form-grid { grid-template-columns: 1fr; } }
</style>
