{% extends 'base.html' %}
{% block title %}Messages{% endblock %}

{% block extra_css %}
<style>
/* ---------------------------------------------------------------------------
   Messages.

   Two panes, like any modern messenger: the conversations on the left --
   avatar, name, time, last message, unread count -- and the open
   conversation on the right. The conversation itself (bubbles, replies,
   reactions, pictures, files, voice messages, composer) is QAChat, shared
   with the floating dock, and is styled in static/css/chat.css.
   --------------------------------------------------------------------------- */

.mx {
    display: grid;
    grid-template-columns: 340px 1fr;
    height: calc(100vh - var(--navbar-height) - 118px);
    min-height: 480px;
    border: 1px solid var(--color-border);
    border-radius: var(--card-radius);
    background: var(--color-surface);
    box-shadow: var(--card-shadow);
    overflow: hidden;
}

/* ------------------------------------------------------------ the list */

.mx-side {
    display: flex;
    flex-direction: column;
    min-height: 0;
    border-right: 1px solid var(--color-border);
    background: var(--color-surface);
}
.mx-side-head { padding: 16px 16px 10px; }
.mx-side-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}
.mx-side-title h3 { margin: 0; font-size: var(--text-md); font-weight: 700; color: var(--color-text-primary); }
.mx-new {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border: 1px solid var(--color-border-strong);
    border-radius: var(--radius-full);
    background: var(--color-surface);
    color: var(--color-brand);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color var(--transition-fast), border-color var(--transition-fast), transform var(--transition-fast);
}
.mx-new:hover { background: var(--color-brand-light); border-color: var(--color-brand); transform: translateY(-1px); }
.mx-search { position: relative; }
.mx-search .bi { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--color-text-muted); font-size: 14px; }
.mx-search input {
    width: 100%;
    padding: 9px 14px 9px 36px;
    border: 1px solid transparent;
    border-radius: var(--radius-full);
    background: var(--color-overlay);
    color: var(--color-text-primary);
    font-size: 13.5px;
    transition: border-color var(--transition-fast), background-color var(--transition-fast), box-shadow var(--transition-fast);
}
.mx-search input:focus, .mx-search input:focus-visible { outline: none; background: var(--color-surface); border-color: var(--color-brand); box-shadow: 0 0 0 3px var(--color-brand-light); }

.mx-threads { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 8px 12px; }
.mx-label {
    padding: 12px 10px 6px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .6px;
    text-transform: uppercase;
    color: var(--color-text-muted);
}
.mx-thread {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 10px 10px;
    margin-bottom: 2px;
    border: 0;
    border-radius: 12px;
    background: transparent;
    text-align: left;
    cursor: pointer;
    transition: background-color var(--transition-fast);
}
.mx-thread:hover { background: var(--row-hover); }
.mx-thread.is-active { background: var(--color-brand-light); }
.mx-thread.is-active::before {
    content: "";
    position: absolute;
    left: 0;
    top: 12px;
    bottom: 12px;
    width: 3px;
    border-radius: 0 3px 3px 0;
    background: var(--color-brand);
}
.mx-thread:focus-visible { outline: 2px solid var(--color-brand); outline-offset: -2px; }
.mx-avatar-wrap { position: relative; flex: 0 0 46px; }
.mx-avatar {
    display: grid;
    place-items: center;
    width: 46px;
    height: 46px;
    border-radius: var(--radius-full);
    background: var(--color-brand);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    overflow: hidden;
}
.mx-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
/* The unread count sits on the avatar, as in most messengers. */
.mx-unread {
    position: absolute;
    top: -3px;
    right: -3px;
    min-width: 20px;
    height: 20px;
    padding: 0 6px;
    border: 2px solid var(--color-surface);
    border-radius: var(--radius-full);
    background: var(--color-danger);
    color: #fff;
    font-size: 10.5px;
    font-weight: 700;
    line-height: 16px;
    text-align: center;
}
.mx-thread-body { flex: 1; min-width: 0; }
.mx-thread-top { display: flex; align-items: baseline; gap: 8px; }
.mx-thread-name {
    flex: 1;
    min-width: 0;
    font-size: 14px;
    font-weight: 600;
    color: var(--color-text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.mx-thread-time { flex-shrink: 0; font-size: 11.5px; color: var(--color-text-muted); }
.mx-thread-preview {
    display: block;
    margin-top: 2px;
    font-size: 12.5px;
    color: var(--color-text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.mx-thread.has-unread .mx-thread-name { font-weight: 700; }
.mx-thread.has-unread .mx-thread-preview { color: var(--color-text-primary); font-weight: 600; }
.mx-thread .mx-start { color: var(--color-brand); font-size: 16px; }
.mx-empty { padding: 32px 16px; text-align: center; font-size: 13px; color: var(--color-text-secondary); }

/* ------------------------------------------------------------ the chat */

.mx-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.mx-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--color-border);
    background: var(--color-surface);
    flex-shrink: 0;
}
.mx-head[hidden] { display: none; }
.mx-head .mx-avatar { width: 40px; height: 40px; font-size: 13px; }
.mx-head-name { font-size: var(--text-md); font-weight: 700; color: var(--color-text-primary); line-height: 1.25; }
.mx-head-sub { font-size: 12.5px; color: var(--color-text-secondary); }
.mx-back {
    display: none;
    place-items: center;
    width: 36px;
    height: 36px;
    border: 0;
    border-radius: var(--radius-full);
    background: transparent;
    color: var(--color-text-primary);
    font-size: 18px;
    cursor: pointer;
}
.mx-back:hover { background: var(--color-overlay); }
.mx-chat { display: flex; flex-direction: column; flex: 1; min-height: 0; }

/* ------------------------------------------------------- people picker */

.mx-people-backdrop {
    position: fixed;
    inset: 0;
    z-index: 10900;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(2, 32, 48, .38);
}
.mx-people-backdrop.is-open { display: flex; }
.mx-people {
    display: flex;
    flex-direction: column;
    width: min(440px, 100%);
    max-height: 72vh;
    border: 1px solid var(--color-border);
    border-radius: 16px;
    background: var(--color-surface);
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    animation: mxIn .16s ease-out;
}
@keyframes mxIn { from { transform: translateY(8px); } to { transform: none; } }
.mx-people-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--color-border); }
.mx-people-head h4 { margin: 0; font-size: 15px; font-weight: 700; flex: 1; }
.mx-people-close { border: 0; background: transparent; font-size: 18px; color: var(--color-text-secondary); cursor: pointer; border-radius: var(--radius-full); width: 32px; height: 32px; }
.mx-people-close:hover { background: var(--color-overlay); }
.mx-people .mx-search { padding: 12px 16px 4px; }
.mx-people .mx-search .bi { left: 29px; }
.mx-people-list { overflow-y: auto; padding: 6px 8px 12px; }

@media (max-width: 991px) {
    .mx { grid-template-columns: 1fr; height: calc(100vh - var(--navbar-height) - 110px); }
    .mx[data-view="chat"] .mx-side { display: none; }
    .mx[data-view="list"] .mx-main { display: none; }
    .mx-back { display: grid; }
}
@media (prefers-reduced-motion: reduce) {
    .mx-people { animation: none; }
    .mx-new:hover { transform: none; }
}
</style>
{% endblock %}

{% block content %}
<div class="page-header mb-3">
    <div>
        <h2>Messages</h2>
        <p>Message anyone in the QA Office directly — text, pictures, files and voice messages.</p>
    </div>
</div>

<div class="mx" id="msgApp" data-view="list">
    <aside class="mx-side" aria-label="Conversations">
        <div class="mx-side-head">
            <div class="mx-side-title">
                <h3>Chats</h3>
                <button type="button" class="mx-new" id="msgNew"><i class="bi bi-pencil-square"></i> New</button>
            </div>
            <div class="mx-search">
                <i class="bi bi-search" aria-hidden="true"></i>
                <label for="msgSearch" class="visually-hidden">Search people or messages</label>
                <input type="search" id="msgSearch" placeholder="Search…" autocomplete="off">
            </div>
        </div>
        <div class="mx-threads" id="msgThreads" role="list"></div>
    </aside>

    <section class="mx-main" aria-label="Conversation">
        <header class="mx-head" id="msgHeader" hidden>
            <button type="button" class="mx-back" id="msgBack" aria-label="Back to conversations"><i class="bi bi-arrow-left"></i></button>
            <span class="mx-avatar" id="msgHeadAvatar" aria-hidden="true"></span>
            <div class="flex-grow-1 min-w-0">
                <div class="mx-head-name" id="msgHeadName"></div>
                <div class="mx-head-sub" id="msgHeadRole"></div>
            </div>
        </header>
        <div class="mx-chat" id="msgChat"></div>
    </section>
</div>

<div class="mx-people-backdrop" id="msgPeopleBackdrop" role="dialog" aria-modal="true" aria-labelledby="msgPeopleTitle">
    <div class="mx-people">
        <div class="mx-people-head">
            <h4 id="msgPeopleTitle">New message</h4>
            <button type="button" class="mx-people-close" id="msgPeopleClose" aria-label="Close"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="mx-search">
            <i class="bi bi-search" aria-hidden="true"></i>
            <label for="msgPeopleSearch" class="visually-hidden">Search people</label>
            <input type="search" id="msgPeopleSearch" placeholder="Search people or an area…" autocomplete="off">
        </div>
        <div class="mx-people-list" id="msgPeopleList"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
(function () {
    'use strict';
    /* The signed-in account, rendered by the server for this request. Message
       payloads carry their sender_id, so the interface decides "mine" by
       comparing the two ids rather than trusting a boolean it cannot verify --
       and a payload built for a different account is ignored rather than drawn
       as this user's own messages. */
    var VIEWER_ID = {{ request.user.pk|default:0 }};

    var appEl = document.getElementById('msgApp');
    var threadsEl = document.getElementById('msgThreads');
    var headerEl = document.getElementById('msgHeader');
    var searchEl = document.getElementById('msgSearch');
    var backdropEl = document.getElementById('msgPeopleBackdrop');
    var peopleListEl = document.getElementById('msgPeopleList');
    var peopleSearchEl = document.getElementById('msgPeopleSearch');

    var activeId = null;
    var baseTitle = document.title;

    function csrf() {
        var m = document.cookie.match(/csrftoken=([^;]+)/);
        return m ? m[1] : '';
    }
    function esc(s) {
        // Quotes too: this text is also placed inside attributes (href, title, src).
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }
    /* One person's picture, or their initials when they have no photo. `who`
       is always the person the avatar is *for* -- a thread's other
       participant or a roster row -- never the signed-in reader. */
    function avatarHTML(who) {
        if (who && who.avatar) {
            return '<span class="mx-avatar"><img src="' + esc(who.avatar) + '" alt="" loading="lazy" decoding="async"></span>';
        }
        return '<span class="mx-avatar" aria-hidden="true">' + esc((who && who.initials) || '') + '</span>';
    }
    function post(url, payload) {
        return fetch(url, {
            method: 'POST', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf() },
            body: JSON.stringify(payload || {})
        }).then(function (r) { return r.json(); });
    }

    /* --------------------------------------------------- the conversation */

    var chat = window.QAChat.create({
        root: document.getElementById('msgChat'),
        viewerId: VIEWER_ID,
        urls: {
            thread: '{% url "messaging:thread_detail" 0 %}',
            send: '{% url "messaging:message_send" 0 %}',
            react: '{% url "messaging:message_react" 0 0 %}',
            del: '{% url "messaging:message_delete" 0 0 %}',
            typing: '{% url "messaging:typing" 0 %}'
        },
        maxMb: {{ chat_config.max_mb|default:15 }},
        maxFiles: {{ chat_config.max_files|default:10 }},
        accept: '{{ chat_config.accept|escapejs }}',
        me: { avatar: '{{ chat_config.me_avatar|escapejs }}', initials: '{{ chat_config.me_initials|escapejs }}' },
        onSent: function () { lastThreadsSig = ''; syncNow(); },
        onIncoming: function () { if (document.hidden) { document.title = '● ' + baseTitle; } },
        onGone: function () {
            if (window.qaToast) { window.qaToast('That conversation is no longer available.', 'info'); }
            showEmpty();
            lastThreadsSig = '';
            loadThreads();
        }
    });

    function setView(view) { appEl.setAttribute('data-view', view); }

    function showEmpty() {
        activeId = null;
        headerEl.hidden = true;
        chat.close();
        setView('list');
        markActive();
        history.replaceState(null, '', window.location.pathname);
    }

    function openThread(id) {
        activeId = Number(id);
        markActive();
        setView('chat');
        headerEl.hidden = false;
        document.getElementById('msgHeadName').textContent = '';
        document.getElementById('msgHeadRole').textContent = '';
        history.replaceState(null, '', window.location.pathname + '?thread=' + activeId);
        chat.open(activeId).then(function (thread) {
            if (!thread || thread.id !== activeId) { return; }
            var avatar = document.getElementById('msgHeadAvatar');
            avatar.outerHTML = avatarHTML(thread).replace('class="mx-avatar"', 'class="mx-avatar" id="msgHeadAvatar"');
            document.getElementById('msgHeadName').textContent = thread.name;
            document.getElementById('msgHeadRole').textContent = [thread.role].concat(thread.areas || []).filter(Boolean).join(' · ');
            lastThreadsSig = '';
            syncNow();
        });
    }

    document.getElementById('msgBack').addEventListener('click', function () { showEmpty(); lastThreadsSig = ''; syncNow(); });

    /* ------------------------------------------------------------ threads */

    function markActive() {
        threadsEl.querySelectorAll('.mx-thread[data-id]').forEach(function (b) {
            var on = Number(b.getAttribute('data-id')) === activeId;
            b.classList.toggle('is-active', on);
            if (on) { b.setAttribute('aria-current', 'true'); } else { b.removeAttribute('aria-current'); }
        });
    }

    function threadRow(t, sub) {
        var unread = t.unread ? '<span class="mx-unread" aria-label="' + t.unread + ' unread">' + (t.unread > 99 ? '99+' : t.unread) + '</span>' : '';
        return '<button type="button" role="listitem" class="mx-thread' + (t.id === activeId ? ' is-active' : '') +
                 (t.unread ? ' has-unread' : '') + '" data-id="' + t.id + '">' +
                 '<span class="mx-avatar-wrap">' + avatarHTML(t) + unread + '</span>' +
                 '<span class="mx-thread-body">' +
                   '<span class="mx-thread-top"><span class="mx-thread-name">' + esc(t.name) + '</span>' +
                   '<span class="mx-thread-time" title="' + esc(t.updated || '') + '">' + esc(window.QAChat.shortTime(t.updated_iso, t.updated)) + '</span></span>' +
                   '<span class="mx-thread-preview">' + esc(sub) + '</span>' +
                 '</span>' +
               '</button>';
    }

    function personRow(p) {
        return '<button type="button" class="mx-thread mx-person" data-user="' + p.id + '">' +
                 '<span class="mx-avatar-wrap">' + avatarHTML(p) + '</span>' +
                 '<span class="mx-thread-body">' +
                   '<span class="mx-thread-top"><span class="mx-thread-name">' + esc(p.name) + '</span></span>' +
                   '<span class="mx-thread-preview">' + esc(p.area_label || p.role) + '</span>' +
                 '</span>' +
                 '<i class="bi bi-plus-lg mx-start" aria-hidden="true"></i>' +
               '</button>';
    }

    function renderThreads(list, newContacts, areaInfo) {
        newContacts = newContacts || [];
        areaInfo = areaInfo || {};
        if (!list.length && !newContacts.length) {
            var empty;
            if (areaInfo.isArea) {
                // The query named a real area: say so, rather than "no match".
                empty = 'No users found in this area.';
            } else if (searchEl.value.trim()) {
                empty = 'Nobody and no messages match that.';
            } else {
                empty = 'No conversations yet.<br>Choose <strong>New</strong> to message someone.';
            }
            threadsEl.innerHTML = '<div class="mx-empty">' + empty + '</div>';
            return;
        }
        var html = '';
        if (areaInfo.isArea && areaInfo.names && areaInfo.names.length) {
            html += '<div class="mx-label">' + esc(areaInfo.names.join(', ')) + '</div>';
        }
        html += list.map(function (t) {
            // In an area search the area identifies the person, so it replaces
            // the message preview for these rows too.
            var sub = t.preview || 'No messages yet';
            if (areaInfo.isArea) {
                var wanted = areaInfo.codes || [];
                var hit = (t.areas || []).filter(function (c) { return wanted.indexOf(c) >= 0; });
                if (hit.length) { sub = hit.join(', '); }
            }
            return threadRow(t, sub);
        }).join('');
        if (newContacts.length) {
            var heading = (areaInfo.isArea && areaInfo.names && areaInfo.names.length)
                ? (list.length ? 'Not yet messaged' : '')
                : 'Start a conversation';
            html += (heading ? '<div class="mx-label">' + esc(heading) + '</div>' : '') + newContacts.map(personRow).join('');
        }
        threadsEl.innerHTML = html;
    }

    // Responses can arrive out of order; only the newest request may paint.
    var threadsRequestSeq = 0;

    function loadThreads() {
        var q = searchEl.value.trim();
        var seq = ++threadsRequestSeq;
        var threadsUrl = '{% url "messaging:thread_list" %}' + (q ? '?q=' + encodeURIComponent(q) : '');
        if (!q) {
            return fetch(threadsUrl, { credentials: 'same-origin' })
                .then(function (r) { return r.json(); })
                .then(function (d) { if (seq === threadsRequestSeq) { renderThreads(d.threads || []); } })
                .catch(function () {});
        }
        // Searching reaches everyone, not only people already in a thread.
        return Promise.all([
            fetch(threadsUrl, { credentials: 'same-origin' }).then(function (r) { return r.json(); }),
            fetch('{% url "messaging:people" %}?q=' + encodeURIComponent(q), { credentials: 'same-origin' }).then(function (r) { return r.json(); })
        ]).then(function (results) {
            if (seq !== threadsRequestSeq) { return; }
            var threads = results[0].threads || [];
            var people = results[1].people || [];
            var known = {};
            threads.forEach(function (t) { known[t.name] = true; });
            var areaNames = results[1].area_names || [];
            renderThreads(threads, people.filter(function (p) { return !known[p.name]; }), {
                isArea: !!results[1].area_search,
                names: areaNames,
                codes: areaNames.map(function (n) { return n.split(' - ')[0]; })
            });
        }).catch(function () {});
    }

    var lastThreadsSig = '';
    function threadsSignature(list) {
        return list.map(function (t) { return t.id + ':' + t.unread + ':' + t.preview + ':' + t.updated; }).join('|');
    }

    /* ----------------------------------------------------------- live sync */

    /*
     * One request per tick carries everything: the badge counts, the
     * conversation list, and every change in the conversation on screen
     * (QAChat.syncParams / applySync). Faster while a conversation is open
     * and someone is at the page; it pauses while the tab is hidden and
     * catches up the moment it is shown again.
     */
    var syncInFlight = false;
    var syncTimer = null;

    function nextTick() {
        clearTimeout(syncTimer);
        var busy = activeId && !document.hidden;
        syncTimer = setTimeout(syncNow, busy ? 1500 : 4000);
    }

    function syncNow() {
        if (syncInFlight || document.hidden) { nextTick(); return Promise.resolve(); }
        syncInFlight = true;
        var params = new URLSearchParams();
        var p = chat.syncParams();
        if (p) {
            params.set('thread', p.thread);
            params.set('seq', p.seq);
            params.set('after', p.after);
        }
        var q = searchEl.value.trim();
        var qa = window.qaActivity;
        return fetch('{% url "messaging:sync" %}?' + params.toString(),
                     { credentials: 'same-origin', headers: qa ? qa.headers() : {} })
            .then(function (r) {
                if (window.qaConnection) { window.qaConnection.ok(); }
                if (qa && qa.expired(r)) { return null; }
                return r.ok ? r.json() : null;
            })
            .then(function (d) {
                if (!d) { return; }
                applyBadges(d);
                if (p && p.thread === activeId) { chat.applySync(d); }
                if (!q && d.threads) {
                    var sig = threadsSignature(d.threads);
                    if (sig !== lastThreadsSig) { lastThreadsSig = sig; renderThreads(d.threads); }
                }
            })
            .catch(function () { if (window.qaConnection) { window.qaConnection.failed(); } })
            .then(function () { syncInFlight = false; nextTick(); });
    }

    // This page polls for everything, so the global badge poller stands down.
    window.qaLiveOwner = true;

    function applyBadges(d) {
        if (typeof window.qaSetBadge !== 'function') { return; }
        if (typeof d.unread_messages === 'number') { window.qaSetBadge('messages', d.unread_messages); }
        if (typeof d.unread_notifications === 'number') { window.qaSetBadge('bell', d.unread_notifications); }
    }

    document.addEventListener('visibilitychange', function () {
        if (!document.hidden) { document.title = baseTitle; syncNow(); }
    });
    window.addEventListener('focus', function () { document.title = baseTitle; });
    document.addEventListener('qa:reconnected', function () { lastThreadsSig = ''; syncNow(); });

    /* -------------------------------------------------------------- people */

    function loadPeople() {
        var q = peopleSearchEl.value.trim();
        fetch('{% url "messaging:people" %}' + (q ? '?q=' + encodeURIComponent(q) : ''), { credentials: 'same-origin' })
            .then(function (r) { return r.json(); })
            .then(function (d) {
                var rows = (d.people || []).map(personRow).join('');
                peopleListEl.innerHTML = rows || '<div class="mx-empty">' +
                    (d.area_search ? 'No users found in this area.' : 'Nobody matches that.') + '</div>';
            })
            .catch(function () {
                peopleListEl.innerHTML = '<div class="mx-empty">' + esc(window.qaRequestError ? window.qaRequestError(0, {}, 'load') : 'Could not load people.') + '</div>';
            });
    }
    function openPicker() {
        backdropEl.classList.add('is-open');
        peopleSearchEl.value = '';
        loadPeople();
        peopleSearchEl.focus();
    }
    function closePicker() { backdropEl.classList.remove('is-open'); }

    document.getElementById('msgNew').addEventListener('click', openPicker);
    document.getElementById('msgPeopleClose').addEventListener('click', closePicker);
    backdropEl.addEventListener('click', function (e) { if (e.target === backdropEl) { closePicker(); } });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && backdropEl.classList.contains('is-open')) { closePicker(); }
    });
    var peopleTimer = null;
    peopleSearchEl.addEventListener('input', function () {
        clearTimeout(peopleTimer);
        peopleTimer = setTimeout(loadPeople, 200);
    });

    /* -------------------------------------------------------------- events */

    document.addEventListener('click', function (e) {
        var person = e.target.closest('.mx-person');
        if (person) {
            post('{% url "messaging:thread_start" %}', { user_id: person.getAttribute('data-user') })
                .then(function (d) {
                    closePicker();
                    if (d.thread) {
                        searchEl.value = '';
                        lastThreadsSig = '';
                        openThread(d.thread.id);
                    } else if (window.qaToast) {
                        window.qaToast(d.error || 'That conversation could not be started.', 'error');
                    }
                })
                .catch(function () { if (window.qaToast) { window.qaToast(window.qaRequestError(0, {}, 'load'), 'error'); } });
            return;
        }
        var thread = e.target.closest('.mx-thread[data-id]');
        if (thread) { openThread(parseInt(thread.getAttribute('data-id'), 10)); }
    });

    var searchTimer = null;
    searchEl.addEventListener('input', function () {
        clearTimeout(searchTimer);
        lastThreadsSig = '';
        searchTimer = setTimeout(loadThreads, 220);
    });

    // Deep link from a notification: /messages/?thread=12
    var wanted = new URLSearchParams(window.location.search).get('thread');
    showEmpty();
    loadThreads().then(function () {
        if (wanted) { openThread(parseInt(wanted, 10)); }
    });
    syncNow();
})();
</script>
{% endblock %}
