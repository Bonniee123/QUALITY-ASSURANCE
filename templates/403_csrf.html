<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Expired | QA Archiving System</title>
    <style>
        :root { --slate: #0F172A; --brand: #1D4ED8; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: hsl(210, 20%, 97%);
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .err-card {
            background: #fff;
            border: 1px solid hsl(215, 16%, 88%);
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            max-width: 460px;
            width: 100%;
            padding: 40px 36px;
            text-align: center;
        }
        .err-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: var(--slate);
            color: #fff;
            font-size: 30px;
            margin-bottom: 20px;
        }
        .err-title { font-size: 24px; font-weight: 700; letter-spacing: -0.4px; margin-bottom: 10px; }
        .err-text { font-size: 15px; color: #64748b; line-height: 1.6; margin-bottom: 24px; }
        .err-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #1D4ED8;
            color: #fff;
            text-decoration: none;
            padding: 11px 22px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            transition: filter .18s, transform .1s;
        }
        .err-btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
    </style>
</head>
<body>
    <div class="err-card">
        <div class="err-badge">&#8635;</div>
        <h1 class="err-title">This page has expired</h1>
        <p class="err-text">For your security, forms stop working after you sign in again or leave a page open for a long time. Go back, refresh the page, and try again.</p>
        <a href="/" class="err-btn">Back to Dashboard</a>
    </div>
</body>
</html>
