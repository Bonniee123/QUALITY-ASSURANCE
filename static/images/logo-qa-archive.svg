<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 88" role="img" aria-labelledby="qaArchiveLogoTitle qaArchiveLogoDesc">
    <title id="qaArchiveLogoTitle">QA Archive</title>
    <desc id="qaArchiveLogoDesc">QA Archive logo for the Quality Assurance Office document archive system.</desc>

    <defs>
        <linearGradient id="qaArchiveMarkBg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#2563EB"/>
            <stop offset="100%" stop-color="#1E3A8A"/>
        </linearGradient>
    </defs>

    <g transform="translate(8, 12)">
        <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#qaArchiveMarkBg)"/>
        <rect x="14" y="18" width="36" height="5" rx="2.5" fill="#ffffff"/>
        <rect x="14" y="29.5" width="26" height="5" rx="2.5" fill="#ffffff" opacity="0.92"/>
        <rect x="14" y="41" width="18" height="5" rx="2.5" fill="#ffffff" opacity="0.78"/>
        <circle cx="46" cy="48" r="3" fill="#ffffff"/>
        <rect x="0.5" y="0.5" width="63" height="63" rx="13.5"
              fill="none" stroke="#1E40AF" stroke-opacity="0.28" stroke-width="1"/>
    </g>

    <g font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
        <text x="92" y="52" fill="hsl(220, 25%, 14%)" font-size="30" font-weight="700" letter-spacing="-0.6">QA</text>
        <text x="138" y="52" fill="hsl(220, 18%, 22%)" font-size="30" font-weight="400" letter-spacing="-0.3">Archive</text>
        <text x="93" y="72" fill="hsl(220, 12%, 48%)" font-size="9.5" font-weight="600" letter-spacing="2.4">QUALITY ASSURANCE OFFICE</text>
    </g>
</svg>
