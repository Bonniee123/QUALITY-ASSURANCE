<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 88" role="img" aria-labelledby="qaArchiveLogoLightTitle">
    <title id="qaArchiveLogoLightTitle">QA Archive (light variant)</title>

    <!-- =====================================================
         INVERSE / LIGHT-ON-DARK lockup.
         Mark is white-on-transparent so the dark surface
         (sidebar, hero panel, dark navbar) shows through.
         ===================================================== -->
    <g transform="translate(8, 12)">
        <!-- Subtle inset frame so the mark stays anchored on dark -->
        <rect x="0" y="0" width="64" height="64" rx="14"
              fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>

        <rect x="14" y="18" width="36" height="5" rx="2.5" fill="#ffffff"/>
        <rect x="14" y="29.5" width="26" height="5" rx="2.5" fill="#ffffff" opacity="0.85"/>
        <rect x="14" y="41" width="18" height="5" rx="2.5" fill="#ffffff" opacity="0.65"/>

        <circle cx="46" cy="48" r="3" fill="#93C5FD"/>
    </g>

    <g font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
        <text x="92" y="52" fill="#ffffff" font-size="30" font-weight="700" letter-spacing="-0.6">QA</text>
        <text x="138" y="52" fill="rgba(255,255,255,0.92)" font-size="30" font-weight="400" letter-spacing="-0.3">Archive</text>
        <text x="93" y="72" fill="rgba(255,255,255,0.62)" font-size="9.5" font-weight="600" letter-spacing="2.4">QUALITY ASSURANCE OFFICE</text>
    </g>
</svg>
